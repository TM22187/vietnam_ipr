name: Windows quality gate

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Generate branded icon
        run: python tools/generate_icon.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build portable application
        run: python -m PyInstaller --noconfirm --clean --workpath .build VietnamLPR.spec
      - name: Smoke test packaged executable
        run: .\dist\VietnamLPR\VietnamLPR.exe --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: VietnamLPR-windows-portable
          path: dist/VietnamLPR
          if-no-files-found: error
